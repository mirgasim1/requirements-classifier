<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software requirements classifier</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f8; color: #182539; font-family: Arial, sans-serif; line-height: 1.55; }
    main { max-width: 760px; margin: 56px auto; padding: 36px; background: white; border: 1px solid #d9e0e9; border-radius: 12px; }
    h1 { margin: 0 0 12px; font-size: 29px; line-height: 1.25; }
    .intro { color: #4d5b6b; margin-bottom: 28px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 170px; padding: 14px; border: 1px solid #7a8797; border-radius: 6px; font: inherit; resize: vertical; }
    textarea:focus { outline: 3px solid #c3d8f7; border-color: #245fa9; }
    button { margin-top: 16px; padding: 12px 24px; background: #245fa9; color: white; border: 0; border-radius: 6px; font: inherit; font-weight: bold; cursor: pointer; }
    button:hover { background: #194981; }
    button:focus-visible { outline: 3px solid #789dd0; outline-offset: 3px; }
    .result { margin-top: 28px; padding: 20px; background: #edf4fc; border: 1px solid #c4d7ed; border-radius: 6px; }
    .result h2 { margin: 0; font-size: 16px; }
    .category { margin: 8px 0; font-size: 25px; font-weight: bold; }
    .result p:last-child { margin-bottom: 0; color: #46566a; }
    .error { margin-top: 24px; padding: 16px; color: #8a2020; background: #fff1f1; border: 1px solid #e6bcbc; border-radius: 6px; }
    @media (max-width: 600px) { main { margin: 18px 12px; padding: 24px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main>
    <h1>Software requirements classifier</h1>
    <p class="intro">Enter one software requirement in English to predict whether it is functional or non-functional.</p>
    <form action="/classify" method="post">
      <label for="requirement">Requirement statement</label>
      <textarea id="requirement" name="requirement" placeholder="Enter a requirement statement here…">{{requirement}}</textarea>
      <button type="submit">Classify</button>
    </form>
    {{result}}
  </main>
</body>
</html>
